<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEP 必要性檢測 · 高通清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050a14;--bar:#070f1d;--line:rgba(120,220,255,.16);--ink:#e4f1f7;--dim:#7f97a6;--accent:#5ff3ff;--bar-h:44px;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden}
  header{height:var(--bar-h);display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(180deg,#0a1526,var(--bar));border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:.86rem;line-height:1;letter-spacing:.12em;white-space:nowrap}
  .brand::before{content:"◉ ";color:var(--accent);font-size:.7em;vertical-align:.12em}
  nav{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35)}
  nav a{display:block;padding:6px 16px;border-radius:999px;color:var(--dim);text-decoration:none;font-weight:500;font-size:.82rem;letter-spacing:.04em;border:1px solid transparent;white-space:nowrap;transition:color .2s,background .2s}
  nav a:hover{color:var(--ink)}
  nav a[aria-current="page"]{color:#dffcff;background:linear-gradient(180deg,rgba(34,227,255,.22),rgba(34,227,255,.08));border-color:rgba(95,243,255,.45);box-shadow:0 0 14px rgba(34,227,255,.2)}
  nav a:focus-visible,.tools a:focus-visible,.tools button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
  .tools{margin-left:auto;display:flex;gap:6px}
  .tools a,.tools button{font-weight:500;font-size:.74rem;font-family:inherit;color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .tools a:hover,.tools button:hover{color:var(--accent);border-color:rgba(95,243,255,.45)}
  main{position:relative;height:calc(100% - var(--bar-h))}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  iframe[hidden]{display:none}
  @media (max-width:640px){.brand{display:none}nav a{padding:6px 12px}.tools a{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">SEP 必要性檢測</div>
  <nav aria-label="分頁">
    <a href="#tool" data-tab="tool">必要性檢測工具</a>
    <a href="#qcom" data-tab="qcom">高通清單</a>
  </nav>
  <div class="tools">
    <button type="button" id="fs" title="這個分頁全螢幕（Esc 離開）">⛶ 全螢幕</button>
    <a id="solo" href="tool.html" target="_blank" rel="noopener" title="不帶分頁列，單獨開啟這一頁">單獨開啟 ↗</a>
  </div>
</header>
<main>
  <iframe id="f-tool" title="必要性檢測工具" data-src="tool.html" allow="fullscreen; clipboard-write" hidden></iframe>
  <iframe id="f-qcom" title="高通清單：HEVC 魚群動畫" data-src="demo/ocean.html" allow="fullscreen" hidden></iframe>
</main>
<script>
  const TABS={tool:{t:"必要性檢測工具"},qcom:{t:"高通清單"}};
  function show(k){
    if(!TABS[k])k="tool";
    for(const id in TABS){
      const f=document.getElementById("f-"+id),on=id===k;
      if(on&&!f.src)f.src=f.dataset.src;   // 第一次切到才載入（魚群動畫較重）
      f.hidden=!on;                        // 隱藏的分頁瀏覽器會暫停其動畫
      document.querySelector(`nav a[data-tab="${id}"]`).setAttribute("aria-current",on?"page":"false");
    }
    const f=document.getElementById("f-"+k);
    document.getElementById("solo").href=f.dataset.src;
    document.title=TABS[k].t+" · SEP 必要性檢測";
    try{f.contentWindow&&f.contentWindow.focus()}catch(e){}
  }
  addEventListener("hashchange",()=>show(location.hash.slice(1)));
  document.getElementById("fs").onclick=()=>{
    const f=[...document.querySelectorAll("iframe")].find(x=>!x.hidden);
    if(f&&f.requestFullscreen)f.requestFullscreen().catch(()=>{});
  };
  show(location.hash.slice(1)||"tool");
</script>
</body>
</html>
